name: Check sources

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch, snapshot and verify every source
        run: npm run -s sources:check | tee check.log
      - name: Commit snapshots and status
        run: |
          git config user.name "source-check[bot]"
          git config user.email "source-check@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Source check $(date -u +%F)"
          git push
      - name: Open an issue when a source changed or failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(sed -n 's/^changed: //p' check.log)
          failed=$(sed -n 's/^failed: //p' check.log)
          if [ "$changed" != "none" ] || [ "$failed" != "none" ]; then
            {
              echo "Commit: ${{ github.server_url }}/${{ github.repository }}/commit/$(git rev-parse HEAD)"
              echo
              echo "Rules citing changed sources are downgraded automatically until a veterinarian re-reviews them."
              echo
              echo '```'
              cat check.log
              echo '```'
            } > body.md
            gh issue create --title "Source check $(date -u +%F) — changed: $changed; failed: $failed" --body-file body.md
          fi
